name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (lean — engine runs in its own image/conda, not CI)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import check
        run: python -c "import pbg_artistoo; print('pbg_artistoo ok')"
