schema_version: 3
name: gg-02-sign-and-temperature-controls
investigation: glazier-graner-sorting
title: "Sign and temperature controls (Fig 7 & Fig 9)"
kind: adversarial
status: ran
confidence: Investigating

question: |
  Are the two adversarial controls reproduced? (1) With NEGATIVE heterotypic tension (checkerboard,
  Fig 7: gamma_ld=-3) the aggregate should intercalate and the heterotypic fraction should RISE —
  the opposite of sorting. (2) At HIGH temperature (Fig 9: sorting energies at T=40) thermal
  fluctuations should overwhelm the tension barriers and the aggregate should MIX rather than sort
  cleanly. Do these behave as the paper predicts, and does the heterotypic-fraction order parameter
  suffice to distinguish them from sorting?

hypothesis: |
  Checkerboard: heterotypic fraction rises (unlike cells prefer contact). High-T: sorting fails —
  cells crumble/mix. If the heterotypic fraction alone cannot separate high-T mixing from sorting,
  that is itself a finding about the order parameter's sufficiency.

investigation_role: |
  The falsification arms for gg-01. Sorting passes by direction + sign; these controls exist to try
  to break that reading. Checkerboard flips the sign; high-T removes the clean sorting the metric
  assumes. A control that behaves like sorting would collapse the interpretation.

baseline:
- name: checkerboard
  composite: pbg_artistoo.composites.glazier_graner.glazier_graner_checkerboard
  params: {n_cells: 110, field_size: 85, temperature: 10.0, interval: 8.0}
- name: high_temperature
  composite: pbg_artistoo.composites.glazier_graner.glazier_graner_high_temperature
  params: {n_cells: 110, field_size: 85, temperature: 40.0, interval: 8.0}

seeds: [1, 2, 3]
run_config:
  mcs_total: 176
  snapshots: 22
  mcs_per_snapshot: 8
  runner: "demo-style direct Composite execution (Node bridge); trajectories in runs/*.csv"

readouts:
- name: heterotypic_fraction
  description: "Fraction of cell-cell boundary between unlike types."
  store_path: readouts/heterotypic_fraction
  units: dimensionless
  status: measured
- name: mean_connectedness
  description: "Mean per-cell connected fraction; drops below 1.0 when cells crumble (mixing)."
  store_path: readouts/mean_connectedness
  units: dimensionless
  status: measured
- name: total_boundary
  description: "Total mismatched-bond boundary length; rises when the interface crumples."
  store_path: readouts/total_boundary
  units: lattice-bonds
  status: measured

behavior_tests:
- name: heterotypic-fraction-rises-under-checkerboard
  classification: primary
  description: "With negative heterotypic tension the fraction at 176 MCS exceeds its early value in every seed."
  measure: {observable: heterotypic_fraction, from: readouts/heterotypic_fraction, reduce: final_vs_initial}
  pass_if: {final_gt_initial: true, min_relative_rise: 0.10}
  requires_simulation: checkerboard
  cites: [glazier1993]
- name: high-temperature-degrades-cell-integrity
  classification: primary
  description: "At T=40 mean connectedness drops below the clean-sorting level (<0.98): the aggregate crumbles/mixes."
  measure: {observable: mean_connectedness, from: readouts/mean_connectedness, reduce: final}
  pass_if: {max: 0.98}
  requires_simulation: high_temperature

reproducibility_metrics:
  comparison: |
    3 seeds each, 176 MCS, 110 cells, 85x85 field. Initial = 8 MCS snapshot; final = 176 MCS.
    Trajectories in runs/glazier_graner_{checkerboard,high_temperature}_seed{1,2,3}.csv.
  metrics:
  - observable: heterotypic_fraction
    model: checkerboard
    expected: "increases (intercalation), Glazier & Graner Fig 7; gamma_ld=-3"
    initial_mean: 0.528
    final_mean: 0.671
    final_std: 0.060
    delta_mean: 0.143
    relative_change: 0.270
    per_seed_final: [0.756, 0.626, 0.632]
    verdict: match
    note: "Rises in all 3 seeds — the opposite sign to sorting. Clean sign control."
  - observable: heterotypic_fraction
    model: high_temperature
    expected: "mixing (sorted state dissolves), Glazier & Graner Fig 9 / Table II"
    initial_mean: 0.453
    final_mean: 0.358
    delta_mean: -0.095
    relative_change: -0.200
    verdict: partial
    note: "hf FALLS by a magnitude comparable to sorting (-0.095 vs -0.100), so hf ALONE does not distinguish mixing from sorting at 176 MCS."
  - observable: mean_connectedness
    model: high_temperature
    expected: "degrades below the clean-sorting level (crumbling/mixing)"
    final_mean: 0.959
    verdict: match
    note: "0.959 vs 0.998 for sorting — the discriminator. Total boundary also rises (4140 vs 3483)."

findings:
- id: F-01
  kind: biological
  status: confirms
  statement: |
    Sign control reproduced: with gamma_ld=-3 (checkerboard, Fig 7) the heterotypic fraction RISES
    0.528 -> 0.671 (+27%, 3 seeds) — unlike cells intercalate, the opposite of sorting. This
    confirms the direction of gg-01 is set by the sign of the heterotypic surface tension.
  evidence:
    observed: "hf 0.528 -> 0.671 (delta +0.143 +/- 0.060)"
    from_test: heterotypic-fraction-rises-under-checkerboard
  expected:
    summary: "Negative heterotypic tension drives intercalation; heterotypic fraction increases (Fig 7)."
    cites: [glazier1993]
- id: F-02
  kind: methodological
  status: partial
  statement: |
    The high-temperature mixing regime (Fig 9) is only PARTIALLY separable on the heterotypic
    fraction: at T=40 hf also falls (-20%, similar to sorting), so the order parameter alone cannot
    tell thermal mixing from engulfment at 176 MCS. The distinguishing signal is in the secondary
    observables — connectedness drops to 0.959 (vs 0.998 sorting) and total boundary rises to 4140
    (vs 3483) — the boundary crumpling the paper describes.
  evidence:
    observed: "high-T: hf -0.095, connectedness 0.959, total_boundary 4140; sorting: hf -0.100, connectedness 0.998, total_boundary 3483"
    from_test: high-temperature-degrades-cell-integrity
    smoking_gun: "connectedness 0.959 vs 0.998 separates mixing from sorting where hf does not"
  explanation: |
    At T=40 fluctuations exceed the surface-tension barriers, so the interface reorganises by
    crumbling rather than by clean engulfment; heterotypic contact still decreases, but cell
    integrity is lost — which hf does not see and connectedness/bulk-moments do.
  next_action: "Add a connectedness/bulk-moment mixing metric and run longer to separate the regimes quantitatively."

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: |
      Both checkerboard and high_temperature composites build and run against the real Artistoo
      engine for all 3 seeds; trajectories committed (runs/*.csv), chart renders.
  biological_validation:
    result: MIXED
    basis: |
      Checkerboard sign-control PASSES cleanly (hf rises +27%, all seeds). High-T mixing is only
      PARTIAL: reproduced in cell-integrity terms (connectedness 0.959, boundary rises) but NOT
      separable from sorting on the heterotypic fraction alone (-0.095 vs -0.100). Honest partial,
      not an inflated pass.
  explanatory_gain:
    result: POSITIVE
    basis: |
      Establishes that the heterotypic fraction is a sufficient order parameter for the SIGN of
      differential adhesion but NOT for the thermal-mixing transition, where a connectedness /
      bulk-moment discriminator is required. Directly sharpens how the investigation's claims should
      be read.

limitations:
- "The high-T arm is under-resolved for a quantitative mixing claim: 176 MCS may be too short for the sorted vs mixed endpoints to diverge on hf, and no bulk-moment metric (paper Table II) is computed."
- "The high-T mixing claim rests on connectedness + total-boundary, not on the primary order parameter; the checkerboard sign control is clean."

literature_anchors:
- expectation: "Negative heterotypic tension (checkerboard) drives intercalation; heterotypic fraction rises."
  model_observable: "readouts/heterotypic_fraction increasing over MCS"
  source: "Glazier & Graner 1993, Fig 7"
  status_in_workspace: "Verified — rises +27% over 3 seeds"
  cites: [glazier1993]
- expectation: "At high temperature the sorted state dissolves and the aggregate mixes (bulk moments blow up)."
  model_observable: "readouts/mean_connectedness dropping; total_boundary rising"
  source: "Glazier & Graner 1993, Fig 9 / Table II"
  status_in_workspace: "Partial — connectedness drops to 0.959, but heterotypic fraction alone does not separate mixing from sorting"
  cites: [glazier1993]

followup_proposals:
- id: mixing-discriminator-metric
  title: "Add a bulk-moment / connectedness mixing metric and run longer"
  status: proposed
  motivation: |
    The high-T arm shows the heterotypic fraction cannot distinguish thermal mixing from sorting at
    176 MCS. A dedicated mixing discriminator (per Table II bulk moments) plus longer runs would
    make the Fig-9 mixing transition a clean quantitative pass instead of a partial.
  hypothesized_mechanism: |
    Compute the aggregate's radial bulk moments (or a connectedness-weighted mixing index) each
    snapshot; run >=1000 MCS; show sorting and high-T diverge on that metric even where hf coincides.

